<!DOCTYPE html>
<html>
<head>
    <title>Post Doubt - Doubt Discussion Forum</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Doubt Discussion Forum</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<div class="container">

    <div class="form-box">

        <h2>Post Your Doubt</h2>

        <form action="/DoubtDiscussionForum/doubt" method="post">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Your Doubt</label>
            <textarea name="question" rows="6" required></textarea>

            <button type="submit">Post Doubt</button>

        </form>

    </div>

</div>

</body>
</html>
