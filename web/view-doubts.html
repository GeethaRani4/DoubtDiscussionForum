<!DOCTYPE html>
<html>
<head>
    <title>View Doubts - Doubt Discussion Forum</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Doubt Discussion Forum</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="post-doubt.html">Post Doubt</a>
        <a href="view-doubts">View Doubts</a>
    </nav>
</header>

<div class="form-container">

    <h2>All Doubts</h2>

    <p>
        To answer a doubt, use the form below.
    </p>

    <form action="answer" method="post">

        <label>Doubt ID</label>
        <input type="number" name="doubt_id" required>

        <label>Your Name</label>
        <input type="text" name="name" required>

        <label>Your Answer</label>
        <textarea name="answer" rows="5" required></textarea>

        <button type="submit">Post Answer</button>

    </form>

</div>

</body>
</html>
